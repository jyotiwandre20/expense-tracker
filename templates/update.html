{% extends "base.html" %}

{% block title %}Update Expense{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-7 col-lg-6">

        <div class="card shadow-sm">

            <div class="card-header bg-warning text-dark text-center">

                <h4 class="mb-0">
                    ✏️ Update Expense
                </h4>

            </div>

            <div class="card-body p-4">

                <form method="POST">

                    <!-- Title -->

                    <div class="mb-3">

                        <label class="form-label fw-bold">
                            Expense Title
                        </label>

                        <input type="text"
                               name="title"
                               class="form-control"
                               value="{{ expense.title }}"
                               required>

                    </div>


                    <!-- Category -->

                    <div class="mb-3">

                        <label class="form-label fw-bold">
                            Category
                        </label>

                        <select name="category"
                                class="form-select"
                                required>

                            <option value="Food"
                                {% if expense.category == "Food" %}selected{% endif %}>
                                Food
                            </option>

                            <option value="Travel"
                                {% if expense.category == "Travel" %}selected{% endif %}>
                                Travel
                            </option>

                            <option value="Shopping"
                                {% if expense.category == "Shopping" %}selected{% endif %}>
                                Shopping
                            </option>

                            <option value="Bills"
                                {% if expense.category == "Bills" %}selected{% endif %}>
                                Bills
                            </option>

                            <option value="Education"
                                {% if expense.category == "Education" %}selected{% endif %}>
                                Education
                            </option>

                            <option value="Health"
                                {% if expense.category == "Health" %}selected{% endif %}>
                                Health
                            </option>

                            <option value="Other"
                                {% if expense.category == "Other" %}selected{% endif %}>
                                Other
                            </option>

                        </select>

                    </div>


                    <!-- Amount -->

                    <div class="mb-3">

                        <label class="form-label fw-bold">
                            Amount (₹)
                        </label>

                        <input type="number"
                               name="amount"
                               class="form-control"
                               value="{{ expense.amount }}"
                               step="0.01"
                               min="0.01"
                               required>

                    </div>


                    <!-- Date -->

                    <div class="mb-3">

                        <label class="form-label fw-bold">
                            Date
                        </label>

                        <input type="date"
                               name="date"
                               class="form-control"
                               value="{{ expense.date }}"
                               required>

                    </div>


                    <!-- Buttons -->

                    <div class="d-flex justify-content-between mt-4">

                        <a href="/"
                           class="btn btn-secondary">

                            ← Cancel

                        </a>

                        <button type="submit"
                                class="btn btn-warning">

                            💾 Update Expense

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
